<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASO-3 — Initial Setup</title><link rel="icon" href="/favicon.svg"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;background:#0e111e;color:#edf0f8;padding:20px}.card{width:min(100%,480px);background:#191f30;border:1px solid #353e54;border-radius:20px;padding:34px;box-shadow:0 24px 70px #0006}h1{font-size:25px;margin:0 0 7px}.sub{color:#9faec4;font-size:14px;line-height:1.6;margin-bottom:28px}label{display:block;font-size:13px;font-weight:650;margin:16px 0}input{width:100%;margin-top:7px;border:1px solid #414d65;background:#0e1526;color:white;border-radius:9px;padding:13px;font:inherit;outline:none}input:focus{border-color:#b484fc}button{background:#8e68d2;border:0;border-radius:10px;width:100%;padding:15px;color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}a{color:#c4a3ff}#status{min-height:23px;font-size:14px;line-height:1.5}code{font-size:12px;background:#11172b;padding:3px;border-radius:4px}
</style></head><body><main class="card"><h1>Set up MASO-3</h1><p class="sub">Create the first administrator after connecting a private Vercel Blob store and setting <code>MASO3_READ_WRITE_TOKEN</code> and <code>SETUP_KEY</code> in Vercel. This setup works only while there are no users.</p><form id="setup"><label>Administrator email<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="admin@yourcompany.com"></label><label>Display name<input name="name" required maxlength="120" placeholder="Workspace Administrator"></label><label>Password (minimum 10 characters)<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>SETUP_KEY from Vercel<input name="setup_key" type="password" required autocomplete="off" placeholder="Your private one-time setup key"></label><button id="submit">Create administrator</button></form><p id="status" role="status"></p><p class="sub"><a href="/">Back to login</a></p></main><script>
document.querySelector('#setup').addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#submit'),info=document.querySelector('#status');btn.disabled=true;info.textContent='Creating administrator…';try{const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'Unable to create account');info.textContent='Administrator created. Username: '+result.username+'. You can now sign in.';e.target.querySelectorAll('input').forEach(x=>x.value='');}catch(e){info.textContent=e.message;}finally{btn.disabled=false;}});
</script></body></html>
